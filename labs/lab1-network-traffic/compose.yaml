# Lab 1 — Network Traffic Analysis and Threat Identification
#
#   docker compose run --rm verify        # check environment + evidence integrity (do this first)
#   docker compose run --rm workstation   # analyst shell with tshark, capinfos, editcap
#   docker compose run --rm reset         # restore work/ from the template (backs up first)
#   docker compose down --remove-orphans  # clean up
#
# Pattern A (ADR-0006): no network, read-only evidence, non-root, all capabilities dropped.
# Your instructor gives you your own evidence folder; the copy in evidence/ is the public
# `demo` variant for practice.
#
# Status: tested 2026-11-17 on macOS Apple Silicon (Docker Desktop) and in CI on
# linux/amd64 and linux/arm64 (tests/integration.sh). Windows: UNTESTED.

name: cyberlab-lab1

x-lab1: &lab1
  extends:
    file: ../../platform/compose/security-baseline.yaml
    service: offline-analyst
  image: ${CYBERLAB_REGISTRY:-ghcr.io/kernalguard}/cyberlab-net-analysis:${CYBERLAB_VERSION:-0.2.1}
  user: "${CYBERLAB_UID:-1000}:${CYBERLAB_GID:-1000}"
  environment:
    CYBERLAB_LAB: lab1
  mem_limit: 512m
  volumes:
    - ${CYBERLAB_EVIDENCE:-./evidence}:/evidence:ro
    - ./work:/work
    - ./lab.yaml:/lab/lab.yaml:ro
    - ./work.template:/lab/work.template:ro

services:
  workstation:
    <<: *lab1
    # Only one service builds (parallel builds of a shared image collide; found on macOS 2026-10-09).
    # Requires the base image to exist locally or in the registry first.
    build:
      context: ../../platform
      dockerfile: images/net-analysis/Dockerfile
    stdin_open: true
    tty: true

  verify:
    <<: *lab1
    command: ["cyberlab-verify", "--config", "/lab/lab.yaml"]

  reset:
    <<: *lab1
    command: ["cyberlab-reset", "--template", "/lab/work.template", "--work", "/work"]
