{% extends "base.html" %}{% block title %}{{ 'Staff log in' if staff else 'Log in' }}{% endblock %}
{% block content %}
<h1>{{ 'Staff log in' if staff else 'Donor log in' }}</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  {% if staff %}<label>Username <input name="username" required></label>
  {% else %}<label>E-mail <input name="email" type="email" required></label>{% endif %}
  <label>Password <input name="password" type="password"></label>
  <button>Log in</button>
</form>
{% endblock %}
