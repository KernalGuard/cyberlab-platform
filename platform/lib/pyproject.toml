[project]
name = "cyberlab-common"
version = "0.1.0"
description = "Shared utilities for CyberLab cybersecurity and digital forensics laboratories"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]
license = "Apache-2.0"
authors = [{ name = "Sharif Vadon" }]

[project.scripts]
cyberlab-manifest = "cyberlab_common.manifest:main"
cyberlab-verify = "cyberlab_common.verify:main"
cyberlab-findings = "cyberlab_common.findings:main"
cyberlab-reset = "cyberlab_common.reset:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cyberlab_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "S311"]  # asserts in tests; subprocess in tests; random is intentional (seeded, non-crypto)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S108"]

[tool.ruff.lint.isort]
known-first-party = ["cyberlab_common"]
