# CyberLab Lab 3 gateway. Runs as an unprivileged user with a read-only root filesystem.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;
    client_max_body_size  64k;

    # One JSON object per request. The session cookie is logged on purpose: it is part of
    # the Lab 3 log-analysis exercise (and a finding in its own right).
    log_format cw_json escape=json
      '{"ts":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
      '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
      '"request_time":$request_time,"user_agent":"$http_user_agent",'
      '"referer":"$http_referer","session":"$cookie_cw_session"}';
    access_log /logs/gateway.jsonl cw_json;
    access_log /dev/stdout cw_json;

    # Docker's embedded DNS, so nginx starts even if the app is still booting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name give.cedarwick.test;

        location = /gateway-health { access_log off; return 200 "ok\n"; }

        location / {
            set $app http://app:5000;
            proxy_pass $app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 15s;
        }
    }
}
