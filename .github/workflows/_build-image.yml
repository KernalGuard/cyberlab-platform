# Reusable: build one image natively on amd64 and arm64 runners, push by digest,
# then publish a multi-arch manifest tagged with the version (no leading "v").
# Called by release.yml. Status: UNTESTED until the next release tag (written 2026-11-17).

name: Build image (reusable)

on:
  workflow_call:
    inputs:
      image:
        description: "Image name without registry, e.g. cyberlab-base"
        required: true
        type: string
      dockerfile:
        description: "Dockerfile path relative to the repo root"
        required: true
        type: string
      build-args:
        description: "Extra build args, one KEY=value per line ({version} is replaced)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ inputs.image }} (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name and build args
        env:
          EXTRA_ARGS: ${{ inputs.build-args }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${GITHUB_REF_NAME#v}"
          echo "IMAGE=ghcr.io/${owner}/${{ inputs.image }}" >> "$GITHUB_ENV"
          {
            echo "BUILD_ARGS<<__EOF__"
            echo "CYBERLAB_VERSION=${GITHUB_REF_NAME}"
            printf '%s\n' "$EXTRA_ARGS" | sed -e "s/{version}/${version}/g" -e "s/{owner}/${owner}/g" | sed '/^$/d'
            echo "__EOF__"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: platform
          file: ${{ inputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ env.BUILD_ARGS }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ inputs.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    name: Publish ${{ inputs.image }} multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ inputs.image }}-*
          merge-multiple: true
          path: /tmp/digests
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list (tag without leading v)
        working-directory: /tmp/digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "$IMAGE:$version" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$version"
