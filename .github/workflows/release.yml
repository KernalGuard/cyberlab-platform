# Publish multi-architecture images to GitHub Container Registry on a version tag.
#   git tag v0.2.0 && git push origin v0.2.0
# Images are tagged with the version without the leading "v" and never overwritten.
# Role images are built FROM the base image of the same version.
# Status: base image release tested 2026-11-17 (v0.1.0). The two-image pipeline
# (base -> net-analysis) is UNTESTED until the next tag.
# New GHCR packages start PRIVATE: set each one to Public once (Package settings).

name: Release images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  base:
    uses: ./.github/workflows/_build-image.yml
    with:
      image: cyberlab-base
      dockerfile: platform/images/base/Dockerfile

  net-analysis:
    needs: base
    uses: ./.github/workflows/_build-image.yml
    with:
      image: cyberlab-net-analysis
      dockerfile: platform/images/net-analysis/Dockerfile
      build-args: |
        BASE_IMAGE=ghcr.io/{owner}/cyberlab-base:{version}
