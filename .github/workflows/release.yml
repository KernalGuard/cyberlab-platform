# Publish multi-architecture images to GitHub Container Registry on a version tag.
#   git tag v0.4.0 && git push origin v0.4.0
# Images are tagged with the version without the leading "v" and never overwritten.
# Role images are built FROM the base image of the same version.
# Status: base -> net-analysis pipeline tested 2026-11-17 (v0.2.0, v0.2.1).
# fs-forensics released in v0.3.0. Lab 3 images (webapp, postgres, gateway,
# web-workstation) released in v0.4.0. ir-workstation (Lab 4) added 2026-11-18:
# UNTESTED until v0.5.0.
# New GHCR packages start PRIVATE: set each one to Public once (Package settings).

name: Release images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  base:
    uses: ./.github/workflows/_build-image.yml
    with:
      image: cyberlab-base
      dockerfile: platform/images/base/Dockerfile

  net-analysis:
    needs: base
    uses: ./.github/workflows/_build-image.yml
    with:
      image: cyberlab-net-analysis
      dockerfile: platform/images/net-analysis/Dockerfile
      build-args: |
        BASE_IMAGE=ghcr.io/{owner}/cyberlab-base:{version}

  fs-forensics:
    needs: base
    uses: ./.github/workflows/_build-image.yml
    with:
      image: cyberlab-fs-forensics
      dockerfile: platform/images/fs-forensics/Dockerfile
      build-args: |
        BASE_IMAGE=ghcr.io/{owner}/cyberlab-base:{version}

  webapp:
    needs: base
    uses: ./.github/workflows/_build-image.yml
    with:
      image: cyberlab-webapp
      dockerfile: platform/images/webapp/Dockerfile
      build-args: |
        BASE_IMAGE=ghcr.io/{owner}/cyberlab-base:{version}

  postgres:
    needs: base
    uses: ./.github/workflows/_build-image.yml
    with:
      image: cyberlab-postgres
      dockerfile: platform/images/postgres/Dockerfile
      build-args: |
        BASE_IMAGE=ghcr.io/{owner}/cyberlab-base:{version}

  gateway:
    needs: base
    uses: ./.github/workflows/_build-image.yml
    with:
      image: cyberlab-gateway
      dockerfile: platform/images/gateway/Dockerfile
      build-args: |
        BASE_IMAGE=ghcr.io/{owner}/cyberlab-base:{version}

  web-workstation:
    needs: base
    uses: ./.github/workflows/_build-image.yml
    with:
      image: cyberlab-web-workstation
      dockerfile: platform/images/web-workstation/Dockerfile
      build-args: |
        BASE_IMAGE=ghcr.io/{owner}/cyberlab-base:{version}

  ir-workstation:
    needs: base
    uses: ./.github/workflows/_build-image.yml
    with:
      image: cyberlab-ir-workstation
      dockerfile: platform/images/ir-workstation/Dockerfile
      build-args: |
        BASE_IMAGE=ghcr.io/{owner}/cyberlab-base:{version}
